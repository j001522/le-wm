defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: 3

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

ckpt_every_n_steps: 2000   # full-state last.ckpt (resume)
ckpt_epoch_interval: 1     # weights_epoch_N.pt / decoder_epoch_N.pt every N epochs (and the last)

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

# Flow-matching dynamics. Only used with model=lewm_flow or model=lewm_flow_ar.
flow:
  detach_target: true
  detach_head: false       # head variant: true = flow head on detached trunk output (no flow grad to the WM)
  mse_weight: 1.0          # 0 = pure flow
  taus_per_token: 4        # head variant: tau samples per context token
  tau_weight: false        # true: weight x-loss by 0.1 + 0.9*tau
  ctx_frac: 0.5            # transformer variant: fraction of windows with history at ctx_tau
  tau_logit_normal: {mean: 0.0, std: 1.0}
  head: {width: 512, depth: 4}
  sample: {steps: 10, power: 2.0, ctx_tau: 0.9}   # power>1 = denser steps near tau=1
  plan: {num_noise: 1, risk_weight: 0.0, seed: 0}

# Visualisation decoder trained on detached latents (own optimizer and RNG: the WM is unchanged).
decoder:
  enabled: false
  frames: last           # last | all: which frames of each window to reconstruct (all needs > 8 GB at batch 32)
  net:
    _target_: module.PixelDecoder
    z_dim: ${embed_dim}
    img_size: ${img_size}
    base_ch: 32
  optimizer:
    type: AdamW
    lr: 3e-4
    weight_decay: 0.0
